name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Describe el problema y lo que esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir…
        2. Tocar…
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Dispositivo y versión de Android
      placeholder: Samsung A26, Android 16
  - type: input
    id: version
    attributes:
      label: Versión de Alarmap
      placeholder: 0.1.0
