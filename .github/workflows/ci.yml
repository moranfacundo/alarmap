name: CI

# Verificaciones rápidas en cada Pull Request y en cada push a main.
# El build de Android no corre aquí todavía (tarda ~9 min y requiere el SDK).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
